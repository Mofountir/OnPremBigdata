name: bigdata-cours

x-hadoop: &hadoop
  image: bigdata/hadoop:3.3.6
  build:
    context: .
    dockerfile: docker/hadoop/Dockerfile

x-hive: &hive
  image: bigdata/hive:3.1.3
  build:
    context: .
    dockerfile: docker/hive/Dockerfile
  environment:
    HIVE_AUX_JARS_PATH: /opt/hive/auxlib
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD dans .env}
  volumes:
    - "${PROJECT_PATH:?Definir PROJECT_PATH dans .env}:/vagrant/TpBigData"
    - "${ORACLE_NOSQL_CLIENT_PATH:?Definir ORACLE_NOSQL_CLIENT_PATH dans .env}/lib:/opt/hive/auxlib:ro"

x-spark: &spark
  image: bigdata/spark:3.5.0
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  volumes:
    - "${PROJECT_PATH:?Definir PROJECT_PATH dans .env}:/vagrant/TpBigData"

services:
  namenode:
    <<: *hadoop
    hostname: namenode
    command: >-
      bash -ec '
      if [ ! -f /data/name/current/VERSION ]; then
        hdfs namenode -format -nonInteractive;
      fi;
      exec hdfs namenode'
    ports: ["127.0.0.1:9870:9870"]
    volumes:
      - "${DATA_PATH:?Definir DATA_PATH dans .env}/hadoop/namenode:/data/name"
      - "${PROJECT_PATH:?Definir PROJECT_PATH dans .env}:/vagrant/TpBigData"
    healthcheck:
      test: "curl -fsS http://localhost:9870/jmx >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 20

  datanode:
    <<: *hadoop
    hostname: datanode
    command: "hdfs datanode"
    volumes:
      - "${DATA_PATH:?Definir DATA_PATH dans .env}/hadoop/datanode:/data/data"
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: "curl -fsS http://localhost:9864/jmx >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 20

  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: "yarn resourcemanager"
    ports: ["127.0.0.1:8088:8088"]
    healthcheck:
      test: "curl -fsS http://localhost:8088/ws/v1/cluster/info >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 20

  nodemanager:
    <<: *hadoop
    hostname: nodemanager
    command: "yarn nodemanager"
    depends_on:
      resourcemanager:
        condition: service_healthy
      datanode:
        condition: service_healthy

  metastore-db:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD dans .env}
    volumes:
      - "${DATA_PATH:?Definir DATA_PATH dans .env}/hive/metastore:/var/lib/mysql"
    healthcheck:
      test: >-
        MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1
        -u hive -D metastore -e 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  hive-metastore:
    <<: *hive
    hostname: hive-metastore
    command: >-
      bash -ec '
      if ! schematool -dbType mysql -info; then
        schematool -dbType mysql -initSchema;
      fi;
      exec hive --service metastore -p 9083'
    depends_on:
      metastore-db:
        condition: service_healthy
      datanode:
        condition: service_healthy
    healthcheck:
      test: "bash -c 'exec 3<>/dev/tcp/localhost/9083'"
      interval: 10s
      timeout: 5s
      retries: 30

  hive:
    <<: *hive
    hostname: hive
    command: >-
      bash -ec '
      hdfs dfsadmin -safemode wait;
      hdfs dfs -mkdir -p /tmp /user/hive/warehouse /user/root;
      hdfs dfs -chmod 1777 /tmp;
      exec hiveserver2'
    ports: ["127.0.0.1:10000:10000"]
    healthcheck:
      test: "bash -c 'exec 3<>/dev/tcp/localhost/10000'"
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      datanode:
        condition: service_healthy
      nodemanager:
        condition: service_started
      hive-metastore:
        condition: service_healthy

  r:
    hostname: r
    profiles: ["r"]
    build:
      context: .
      dockerfile: docker/r/Dockerfile
    command: "sleep infinity"
    volumes:
      - "${PROJECT_PATH:?Definir PROJECT_PATH dans .env}:/vagrant/TpBigData"
    depends_on:
      hive:
        condition: service_healthy

  spark-master:
    <<: *spark
    hostname: spark-master
    command: >-
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: "bash -c 'exec 3<>/dev/tcp/localhost/7077'"
      interval: 10s
      timeout: 5s
      retries: 20

  spark-worker:
    <<: *spark
    hostname: spark-worker
    command: >-
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 2 --memory 1g --webui-port 8081 spark://spark-master:7077
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      spark-master:
        condition: service_healthy

networks:
  default:
    name: bigdata-network
